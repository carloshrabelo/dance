image: node:lts
pages:
  stage: deploy
  cache:
    key:
      files:
        - yarn.lock
      prefix: yarn
    paths:
      - node_modules/
  script:
    - yarn install
    - yarn run build
    - cp -a build/client/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
